<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Editor Pro</title>
    <!-- Memanggil Tailwind CSS v4 via CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <main class="max-w-4xl w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col gap-6">
        <h1 class="text-3xl font-extrabold text-center tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
            ENALL DESIGNER PRO AI
        </h1>

        <!-- Area Upload & Canvas -->
        <div class="flex flex-col items-center justify-center border-2 border-dashed border-slate-600 rounded-xl p-4 bg-slate-950/50 min-h-[350px] relative overflow-hidden">
            <input type="file" id="uploadInput" accept="image/*" class="mb-4 block text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-500 file:text-slate-950 hover:file:bg-cyan-400 cursor-pointer">
            <canvas id="photoCanvas" class="max-w-full max-h-[400px] border border-slate-700 hidden rounded shadow-md"></canvas>
            <div id="placeholderText" class="text-slate-500 text-center py-10">Belum ada foto. Klik tombol di atas untuk memilih foto.</div>
        </div>

        <!-- Panel Prompt AI & Tombol Aksi -->
        <div class="flex flex-col gap-3">
            <label for="aiPrompt" class="text-sm font-medium text-slate-300">Instruksi AI (Prompt):</label>
            <textarea id="aiPrompt" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 placeholder-slate-600" placeholder="Contoh: Ubah latar belakang menjadi pemandangan cyberpunk futuristik..."></textarea>
            
            <div class="flex flex-wrap gap-3 mt-2 justify-center">
                <button id="processBtn" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-6 py-3 rounded-lg shadow-lg transition-all transform active:scale-95 disabled:opacity-50" disabled>
                    Proses dengan Gemini AI
                </button>
                <button id="downloadBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-6 py-3 rounded-lg shadow transition-all active:scale-95 disabled:opacity-50" disabled>
                    Unduh Hasil Foto
                </button>
            </div>
        </div>

        <!-- Status Loading / Log -->
        <div id="statusText" class="text-center text-sm font-semibold text-cyan-400 min-h-[20px]"></div>
    </main>

    <!-- Memanggil file logika utama web -->
    <script src="app.js"></script>
</body>
</html>
